<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnix-Prenium Product Details</title>
    <link rel = "stylesheet" href = "product-detail.css">
    <link rel = "stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main class = "product-detail-page">
        <section class = "image-gallery-side">
          <div class = "product-hero-image">
            <img id = "display-img" src = "https://via.placeholder.com/500x500?text=Loading+Furnix..." alt = "Product View">
          </div>
        </section>
        <section class = "product-details-side">
              <h1 id = "dyn-title">Loading Product....</h1>
              <div class = "product-rating-row">
                <span id = "dyn-rating-num">0.0</span>
                <span id = "stars-container"></span>
              </div>
              <p class = "product-price-tag">$<span id = "dyn-price">0.00</span></p>
              <p id = "dyn-description">Fetching item specification, please wait...</p>
              <div class="action-buttons-row">
                <button class = "add-to-cart-btn"><i class = "fa-solid fa-bag-shopping"></i>Add to Cart</button>
                <button class="favourite-btn"><i class = "fa-regular fa-heart"></i></button>
              </div>
              <hr class = "section-divisor">
              <section class = "customer-reviews-block">
                <h2>Customer Feedback</h2>
                <div id = "comments-box"></div>
              </section>
        </section>
    </main>
    <script src = "product.js"></script>
</body>
</html>
